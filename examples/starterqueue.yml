name: StarterQueue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit starter queue
        uses: VyxorDev/starterqueue@v0.2.0
        with:
          token: ${{ github.token }}
          fail-on: fail
