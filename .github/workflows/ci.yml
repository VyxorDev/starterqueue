name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - run: npm run test:package

      - name: Smoke test local action
        uses: ./
        env:
          NODE_ENV: production
        with:
          repository: VyxorDev/starterqueue
          label: __starterqueue_action_smoke__
          policy: strict
          rule-levels: SQ001=warn,SQ009=fail
          fail-on: none
