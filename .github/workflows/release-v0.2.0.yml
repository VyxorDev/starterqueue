name: Release v0.2.0

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type v0.2.0 to publish the release.
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'VyxorDev/starterqueue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Confirm release intent
        shell: bash
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$RELEASE_CONFIRM" = "v0.2.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Validate release metadata
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "$PACKAGE_VERSION" = "0.2.0"
          test -f action.yml

      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
      - run: npm run test:package

      - name: Build release artifacts
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          npm pack
          sha256sum "starterqueue-${PACKAGE_VERSION}.tgz" > SHA256SUMS.txt

          awk '
            /^## \[0\.2\.0\]/ { found=1 }
            found && /^## \[/ && $0 !~ /^## \[0\.2\.0\]/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          test -s RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"

          if gh release view v0.2.0 >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view v0.2.0 --json isDraft --jq '.isDraft')"
            IS_PRERELEASE="$(gh release view v0.2.0 --json isPrerelease --jq '.isPrerelease')"
            TARGET_COMMITISH="$(gh release view v0.2.0 --json targetCommitish --jq '.targetCommitish')"
            ASSET_NAMES="$(gh release view v0.2.0 --json assets --jq '.assets[].name')"

            if [[ "$IS_DRAFT" == "false" && "$IS_PRERELEASE" == "false" ]] \
              && [[ "$TARGET_COMMITISH" == "$RELEASE_SHA" ]] \
              && grep -Fxq "starterqueue-0.2.0.tgz" <<<"$ASSET_NAMES" \
              && grep -Fxq "SHA256SUMS.txt" <<<"$ASSET_NAMES"; then
              echo "Published GitHub release v0.2.0 already exists at the expected commit with the expected assets."
              exit 0
            fi

            echo "GitHub release v0.2.0 exists but does not match the expected release state."
            exit 1
          fi

          gh release create v0.2.0 \
            --target "$RELEASE_SHA" \
            --title "StarterQueue v0.2.0" \
            --notes-file RELEASE_NOTES.md \
            "starterqueue-0.2.0.tgz#npm package tarball" \
            "SHA256SUMS.txt#SHA-256 checksums"
