name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'VyxorDev/starterqueue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build release artifacts
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          test "$PACKAGE_VERSION" = "0.1.0"
          npm pack
          sha256sum "starterqueue-${PACKAGE_VERSION}.tgz" > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "GitHub release v0.1.0 already exists; nothing to do."
            exit 0
          fi

          gh release create v0.1.0 \
            --target "$GITHUB_SHA" \
            --title "StarterQueue v0.1.0" \
            --notes-file CHANGELOG.md \
            "starterqueue-0.1.0.tgz#npm package tarball" \
            "SHA256SUMS.txt#SHA-256 checksums"
